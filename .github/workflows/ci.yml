name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint bash scripts
        run: |
          shellcheck -S warning \
            install.sh \
            panic.sh \
            preserve.sh \
            tests/test-watchpost-baseline.sh \
            canary/canary-gen.sh \
            guestmode/setup-guestmode.sh \
            shellguard/install.sh \
            watchpost/install.sh \
            watchpost/watchpost.sh

  zsh-syntax:
    name: zsh syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Parse zsh scripts
        # ShellCheck cannot parse zsh (SC1071), so these get a real zsh parse instead.
        run: |
          for f in clipsentinel/clipsentinel.sh clipsentinel/install.sh shellguard/shellguard.zsh; do
            echo "-- $f"
            zsh -n "$f"
          done

  detection-corpus:
    name: Detection corpus (macOS)
    # MUST run on macOS, not ubuntu. `[[ =~ ]]` and glob ranges bind to the
    # platform's regex library, so a Linux-green corpus would not prove macOS
    # behaviour — and macOS is the only platform this kit runs on.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert every payload shape is classified correctly
        # Also fails if either tool stops sourcing the shared grammar, or grows
        # its own host allowlist / detection regex again. That drift is what let
        # ShellGuard and ClipSentinel silently disagree on 6 of 13 payloads.
        run: zsh tests/run-corpus.zsh

  zle-integration:
    name: ShellGuard blocks in a real shell (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Drive an interactive zsh over a pty and check a marker file
        # The corpus proves the grammar. This proves the widget is actually
        # wired up, that the confirmation prompt can be COMPLETED, and that an
        # aborted payload genuinely does not execute. v0.1.0 shipped a
        # confirmation gate that could not be completed at all.
        run: zsh tests/test-zle-integration.zsh

  watchpost-baseline:
    name: WatchPost baseline cannot be blinded (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pre-seed, delete and tamper with the baseline in a sandbox
        # The baseline lives in the user's home dir, writable by exactly the
        # malware this tool watches for. Deleting it used to be read as a first
        # run, which silently absorbed whatever had just been planted.
        run: bash tests/test-watchpost-baseline.sh

  exposurescan-tests:
    name: ExposureScan redaction invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run redaction test suite
        # The load-bearing invariant: no secret value ever reaches an output artifact.
        working-directory: exposurescan
        run: python3 -m unittest discover -s tests -v
